
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .dashboard {
            width: 90%;
            max-width: 450px;
            padding: 50px 35px;
            background: #fff;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .dashboard h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .dashboard .username {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 35px;
        }

        .dashboard form {
            width: 100%;
        }

        .dashboard button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .dashboard button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 480px) {
            .dashboard {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h2>Welcome</h2>

        <h2 class="username">{{ user.username }}</h2>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>

    </div>

</body>
</html>
